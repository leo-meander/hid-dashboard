name: Cron — PageSpeed sync (Avg Website Load Speed KPI)

# Runs on the 1st of each month, 20:00 UTC (03:00 ICT the 2nd). One reading
# per branch per month — same cadence Mason was checking PageSpeed Insights
# by hand before this was automated. sync_page_speed() defaults to the
# current year/month, so this always writes the month it runs in.
on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run migrations
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${BACKEND_URL}/api/sync/run-migrations" \
            -H "X-Sync-Token: ${SYNC_TRIGGER_TOKEN}" \
            --max-time 60) || true
          cat response.json
          echo
          echo "Migration HTTP $http_code"

      - name: Sync PageSpeed Insights
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            http_code=$(curl -sS -o response.json -w "%{http_code}" \
              -X POST "${BACKEND_URL}/api/sync/page-speed" \
              -H "X-Sync-Token: ${SYNC_TRIGGER_TOKEN}" \
              --max-time 300) || true
            cat response.json
            echo
            if [ "$http_code" = "200" ]; then
              echo "OK"
              exit 0
            fi
            echo "Got HTTP $http_code, retrying in 30s..."
            sleep 30
          done
          echo "Failed after 3 attempts"
          exit 1
